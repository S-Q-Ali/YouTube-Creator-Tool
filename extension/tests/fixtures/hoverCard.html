<!--
  Trimmed copy of a YouTube card. Three shapes of the same overlay, because the
  placement rule has to survive all of them:

  card-1  the pair sits in one box (ytp-*-toggle-button)  -> anchor is that box
  card-2  no overlay classes, labels only                  -> anchor found by label
  card-3  nothing to hang under                             -> no anchor, no icon
  card-4  today's lockup: a yt-thumbnail-view-model with NO hover row at all,
          because YouTube only builds that row once the card is hovered  -> the
          icon places itself in the image instead. This one is the shape that
          actually ships today, and the earlier fixture left it out.
  grid   the real nesting, for the end-to-end placement test
-->
<ytd-rich-grid-renderer>
  <ytd-rich-item-renderer>
    <yt-lockup-view-model content-id="dQw4w9WgXcQ">
      <a href="/watch?v=dQw4w9WgXcQ">
        <ytd-thumbnail>
          <img class="yt-core-image" src="https://i.ytimg.com/vi_webp/dQw4w9WgXcQ/hq720.webp" />
          <div class="overlay">
            <div class="pair">
              <button class="ytp-mute-toggle-button" aria-label="Mute"></button>
              <button class="ytp-caption-toggle-button" aria-label="Subtitles on"></button>
            </div>
          </div>
        </ytd-thumbnail>
        <h3 title="The first card in a real grid">
          <a href="/watch?v=dQw4w9WgXcQ">The first card in a real grid</a>
        </h3>
      </a>
    </yt-lockup-view-model>
  </ytd-rich-item-renderer>

  <ytd-rich-item-renderer lockup>
    <yt-lockup-view-model content-id="VtF4k9Lm2Rs">
      <a class="ytLockupViewModelContentImage" href="/watch?v=VtF4k9Lm2Rs">
        <yt-thumbnail-view-model>
          <img class="ytCoreImageHost" src="https://i.ytimg.com/vi_webp/VtF4k9Lm2Rs/hq720.webp" />
          <yt-thumbnail-overlay-time-status-renderer>17:04</yt-thumbnail-overlay-time-status-renderer>
        </yt-thumbnail-view-model>
      </a>
      <div class="ytLockupMetadataViewModelTextContainer">
        <a class="ytLockupMetadataViewModelTitle" href="/watch?v=VtF4k9Lm2Rs" title="The card YouTube ships today">The card YouTube ships today</a>
      </div>
    </yt-lockup-view-model>
  </ytd-rich-item-renderer>
</ytd-rich-grid-renderer>
<ytd-rich-item-renderer>
  <a id="thumbnail-1" href="/watch?v=8sA8Y5F3p9M">
    <ytd-thumbnail>
      <img src="https://i.ytimg.com/vi_webp/8sA8Y5F3p9M/hq720.webp" />
      <div class="overlay">
        <div class="pair">
          <button class="ytp-mute-toggle-button" aria-label="Mute"></button>
          <button class="ytp-caption-toggle-button" aria-label="Subtitles on"></button>
        </div>
        <button class="more" aria-label="Action menu"></button>
      </div>
    </ytd-thumbnail>
    <h3 title="How I plan a month of uploads"><a href="/watch?v=8sA8Y5F3p9M">How I plan a month of uploads</a></h3>
  </a>
</ytd-rich-item-renderer>

      <img src="https://i.ytimg.com/vi/2Kq9TbZ4wXc/hqdefault.jpg" />
