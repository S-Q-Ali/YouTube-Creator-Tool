<!doctype html>
<!--
  A YouTube grid shaped like the real one, trimmed to what tile selection has to
  get right. The first card is the live lockup markup: a ytd-rich-item-renderer
  wrapper around a yt-lockup-view-model, which is exactly the nesting that used
  to earn a card two strips. The rest cover the cases that must be skipped or
  still work: an already-annotated card, a legacy ytd-video-renderer, an ad
  slot, and a tile with no watch link.
-->
<div id="grid">
  <ytd-rich-grid-renderer>
    <div id="contents">
      <ytd-rich-item-renderer>
        <yt-lockup-view-model class="ytLockupViewModelHost content-id-gEQ0BLyVJhY">
          <a class="yt-lockup-view-model__content-image" href="/watch?v=gEQ0BLyVJhY&amp;pp=ugUEEgJlbg%3D%3D">
            <div class="yt-lockup-view-model-wiz__content-thumbnail">
              <img src="https://i.ytimg.com/vi/gEQ0BLyVJhY/hq720.jpg?sqp=…&amp;rs=AOnVawiw7Ns" alt="">
              <yt-thumbnail-badge-view-model>
                <badge-shape class="ytBadgeShapeHost" aria-label="9 minutes, 41 seconds"></badge-shape>
              </yt-thumbnail-badge-view-model>
              <button aria-label="Mute"></button>
              <button aria-label="Subtitles on"></button>
            </div>
          </a>
          <div class="yt-lockup-view-model-wiz__content-metadata">
            <h3 class="yt-lockup-metadata-view-model__title" title="How to make shorts that go viral every time">
              <a href="/watch?v=gEQ0BLyVJhY&amp;pp=ugUEEgJlbg%3D%3D">How to make shorts that go viral every time</a>
            </h3>
            <div class="yt-lockup-metadata-view-model-wiz__text-container">
              <yt-content-metadata-view-model class="ytContentMetadataViewModelHost ytContentMetadataViewModelMediumText">
                <span class="yt-content-metadata-view-model__metadata-text">Logan</span>
                <span class="yt-content-metadata-view-model__metadata-text">2.7M</span>
                <span class="yt-content-metadata-view-model__metadata-text">2y ago</span>
              </yt-content-metadata-view-model>
            </div>
          </div>
        </yt-lockup-view-model>
      </ytd-rich-item-renderer>

      <ytd-rich-item-renderer>
        <yt-lockup-view-model class="content-id-aBcDeFgHiJk">
          <a href="/watch?v=aBcDeFgHiJk">Another video</a>
          <div class="ns-line"><div class="ns-line-row"></div><div class="ns-line-row"></div></div>
        </yt-lockup-view-model>
      </ytd-rich-item-renderer>

      <ytd-rich-item-renderer>
        <ytd-video-renderer class="ytLegacyCard">
          <a id="video-title-link" href="/watch?v=LegAcY12345">Legacy card</a>
          <div id="metadata-line"><span class="yt-content-metadata-view-model__metadata-text">1.2M views</span></div>
        </ytd-video-renderer>
      </ytd-rich-item-renderer>

      <ytd-ad-slot-renderer>
        <ytd-rich-item-renderer>
          <yt-lockup-view-model class="content-id-Promoted1234">
            <a href="/watch?v=Promoted1234">Sponsored</a>
          </yt-lockup-view-model>
        </ytd-rich-item-renderer>
      </ytd-ad-slot-renderer>

      <ytd-rich-item-renderer>
        <yt-lockup-view-model class="content-id-NoLinkHere1">
          <span>Nothing to watch</span>
        </yt-lockup-view-model>
      </ytd-rich-item-renderer>
    </div>
  </ytd-rich-grid-renderer>
</div>
