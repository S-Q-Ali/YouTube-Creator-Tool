<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ns-theme.css" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        padding: 16px;
        background: var(--ns-soot);
        color: var(--ns-ink);
        font-family: var(--ns-font-ui);
        font-size: 13px;
      }
      .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ns-mute); }
      .head .dot.on { background: var(--ns-amber); }
      .head .dot.off { background: var(--ns-bad); }
      .head h1 { margin: 0; font-size: 13px; font-weight: 600; }
      .head #serverText { margin-left: auto; font-size: 12px; color: var(--ns-mute); }
      .section { margin: 14px 0; }
      .section-title { font-size: 12px; color: var(--ns-mute); margin: 0 0 4px; }
      .opt { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; }
      .opt select { margin-left: auto; background: var(--ns-lift); color: var(--ns-ink); border: 1px solid var(--ns-hair);
        border-radius: var(--ns-radius); padding: 3px 6px; font-family: var(--ns-font-ui); }
      footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--ns-hair); }
      footer a { color: var(--ns-amber); text-decoration: none; font-size: 12px; }
      footer a:hover { text-decoration: underline; }
      .err { color: var(--ns-bad); font-size: 12px; line-height: 1.5; }
      .muted { color: var(--ns-mute); }
    </style>
  </head>
  <body data-ns-theme>
    <div class="head">
      <span class="dot" id="dot"></span>
      <h1>Niche-Scope</h1>
      <span id="serverText">Checking server…</span>
    </div>
    <div id="body">
      <div class="ns-strip"><span class="k">status</span><span class="v ns-dead">loading</span></div>
    </div>
    <div class="section" id="prefsCard">
      <div class="section-title">Overlay on YouTube</div>
      <label class="opt"><input type="checkbox" id="showCard" /> Watch-page score card</label>
      <label class="opt"><input type="checkbox" id="showPills" /> Thumbnail signal pills</label>
      <label class="opt"><input type="checkbox" id="showHover" /> Thumbnail hover data</label>
      <label class="opt"><input type="checkbox" id="showResearch" /> Search and channel research</label>
      <label class="opt"><input type="checkbox" id="showCoach" /> AI coach on watch pages</label>
      <div class="opt">
        <span>Pills per pass</span>
        <select id="pillLimit">
          <option value="12">12</option>
          <option value="24">24</option>
          <option value="40">40</option>
          <option value="60">60</option>
        </select>
      </div>
    </div>
    <footer>
      <a href="http://localhost:3000" target="_blank" rel="noopener">Open dashboard</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
